name: quick_doc_filler
description: 快速填写和提交微信/腾讯文档、飞书、金山文档并集成 GitHub 项目分析的 Flutter 应用
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_form_builder: ">=9.0.0 <12.0.0"
  dio: ^5.7.0
  flutter_secure_storage: ">=9.0.0 <11.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
